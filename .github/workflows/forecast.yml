name: Eisbach Forecast

on:
  # Primary trigger. Self-contained: no external service, no token that can quietly
  # expire. GitHub's scheduler is often late and occasionally skips, which is an
  # acceptable trade for a thrice-daily forecast that depends on nothing outside GitHub.
  # Times are UTC: 04 (morning), 12 (midday), 20 (evening) — in Munich roughly 05/06,
  # 13/14 and 21/22 depending on daylight saving.
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'
    - cron: '0 20 * * *'

  # Manual runs, for testing a change or catching up after a missed one. Its real value
  # is simply existing: the previous workflow had no way to be started by hand at all.
  workflow_dispatch:

  # Optional external trigger, for a more punctual schedule. See docs/scheduling.md.
  repository_dispatch:
    types: [trigger_forecast]

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Scoped to this job: `publish` needs neither of these, and the plots reach it
    # through the artifact rather than through the repository.
    permissions:
      contents: write   # committing the archive
      issues: write     # the failure notification below

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e .

      # ~10 MB, pinned by SHA256. Cached so it is fetched once rather than every run.
      - name: Cache model checkpoint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/model
          key: checkpoint-${{ hashFiles('eisbach/model/checkpoint.py') }}

      - name: Forecast
        run: python main.py

      # The archive is the only copy of every forecast we have made and of the DWD
      # forecasts as they were issued, so it belongs in the repository. It is
      # month-partitioned, so each run appends to one small file.
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive
          git diff --cached --quiet && echo "archive unchanged" && exit 0
          git commit -m "chore: archive forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          # A human push to the branch during the run would otherwise reject this one,
          # fail the job and open a failure issue for what is only a stale base. The
          # commit touches nothing but data/archive, so rebasing it is safe.
          for attempt in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && \
              git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          echo "could not push the archive after 3 attempts" >&2
          exit 1

      # Plots and the CSV are regenerated from scratch every run, so keeping their
      # history is pointless — committing them is what grew .git to 175 MB. GitHub Pages
      # deploys them without touching git at all, and gives them a URL a human can open.
      - name: Assemble the published page
        run: |
          mkdir -p public
          cp docs/page/index.html public/
          cp Prediction.png Prediction_Backtest.png Prediction.csv public/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

      - name: Report failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // A silent failure is how this pipeline went unnoticed for three days.
            // But a persistent one — GKD changing its table markup, say — would open
            // three issues a day forever, so comment on the open one where there is
            // one and only open a new issue when there is not.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled forecast failed.\n\n[Run log](${runUrl})\n\nLogs expire, so capture anything useful before they do.`;

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'forecast-failure',
              per_page: 1,
            });

            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Forecast run failed (${new Date().toISOString().slice(0, 10)})`,
                body,
                labels: ['forecast-failure'],
              });
            }

  # Deployment has to be its own job: actions/deploy-pages requires the github-pages
  # environment, which cannot be attached to a job that does anything else.
  publish:
    needs: forecast
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write      # publishing the plots
      id-token: write   # required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
