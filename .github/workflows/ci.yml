name: CI

on:
  # A branch with an open pull request would otherwise be tested twice per push, once
  # for each event, and the two runs land in different concurrency groups so neither
  # cancels the other.
  push:
    branches: [main]
    # The forecast run commits to main three times a day and touches nothing but CSVs.
    # Those commits use the default GITHUB_TOKEN, which GitHub already suppresses
    # workflow triggering for — but that guard is implicit and would vanish the moment
    # the push switched to a PAT or deploy key, as docs/scheduling.md contemplates.
    paths-ignore:
      - 'data/archive/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # pyproject declares requires-python >= 3.11, so test both ends of that claim
    # rather than only the version the runner happens to default to.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # CPU-only torch: the default wheel drags in the whole CUDA stack, which is
        # several GB the runner will never use.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      # The model tests fetch the 10 MB checkpoint once. Cached so that is not
      # re-downloaded on every push and every pull request.
      - name: Cache model checkpoint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/model
          key: checkpoint-${{ hashFiles('eisbach/model/checkpoint.py') }}

      - name: Lint
        run: ruff check .

      - name: Test
        # Offline apart from the checkpoint fetch above. Nothing here may hit GKD or
        # Bright Sky — a test that needs live data belongs in the pipeline run.
        run: pytest -q
