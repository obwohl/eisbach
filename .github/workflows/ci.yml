name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        # CPU-only torch: the default wheel drags in the whole CUDA stack, which is
        # several GB the runner will never use.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The unit tests must not touch the network; anything that does belongs in the
        # pipeline run, not here.
        run: pytest -q
