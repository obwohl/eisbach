name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        # CPU-only torch: the default wheel drags in the whole CUDA stack, which is
        # several GB the runner will never use.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      # The model tests fetch the 10 MB checkpoint once. Cached so that is not
      # re-downloaded on every push and every pull request.
      - name: Cache model checkpoint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/model
          key: checkpoint-${{ hashFiles('eisbach/model/checkpoint.py') }}

      - name: Lint
        run: ruff check .

      - name: Test
        # Offline apart from the checkpoint fetch above. Nothing here may hit GKD or
        # Bright Sky — a test that needs live data belongs in the pipeline run.
        run: pytest -q
