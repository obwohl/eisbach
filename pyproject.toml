[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eisbach"
version = "0.1.0"
description = "Probabilistic water temperature forecast for the Eisbach in Munich"
requires-python = ">=3.11"

# Runtime dependencies of the production pipeline, and nothing else. The previous
# requirements.txt also carried scikit-learn, optuna, tensorboard and einops; those were
# never imported by this code and only existed because the vendored model's upstream
# package pulled its training machinery in at import time.
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
    "cycler>=0.12",
    "scipy>=1.10",
    "torch>=2.3",
    "einops>=0.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["eisbach*"]

[tool.pytest.ini_options]
# Without this, pytest walks into the vendored model's upstream test directory and dies
# during collection.
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:eisbach.*"]

[tool.ruff]
line-length = 110
# `eisbach/model/duet/` is vendored upstream code, kept byte-identical so it stays
# diffable against its source. `archive/` is unmaintained research code.
extend-exclude = ["archive", "eisbach/model/duet"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
